name: MCP-01 final structured hardening

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-final-structured-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply final fail-closed remediation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual} for {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/editorial.ts",
              '''export function affairSemanticsLines(\n''',
              '''export function normalizeKnownEnumCounts<T extends string>(\n  counts: Record<string, number>,\n  allowed: readonly T[],\n): { known: Partial<Record<T, number>>; unrecognizedCount: number } {\n  const known: Partial<Record<T, number>> = {};\n  let unrecognizedCount = 0;\n\n  for (const [code, count] of Object.entries(counts)) {\n    if (!Number.isFinite(count) || count < 0) continue;\n    const knownCode = knownEnumCode(code, allowed);\n    if (knownCode) {\n      known[knownCode] = count;\n    } else {\n      unrecognizedCount += count;\n    }\n  }\n\n  return { known, unrecognizedCount };\n}\n\nexport function affairSemanticsLines(\n''',
          )

          replace(
              "src/tools/affairs.ts",
              '''    if (affair.sentence) lines.push(`**Peine** : ${affair.sentence}`);\n    if (affair.appeal) lines.push(`**Recours** : ${affair.appeal}`);\n''',
              '''    if (affair.sentence) {\n      lines.push("**Peine, donnée Poligraph :**");\n      lines.push(quoteData(affair.sentence));\n    }\n    if (affair.appeal) {\n      lines.push("**Recours, donnée Poligraph :**");\n      lines.push(quoteData(affair.appeal));\n    }\n''',
          )

          replace(
              "src/tools/factchecks.ts",
              'import { knownEnumCode, quoteData } from "../editorial.js";\n',
              'import { knownEnumCode, normalizeKnownEnumCounts, quoteData } from "../editorial.js";\n',
          )

          replace(
              "src/tools/factchecks.ts",
              '''function formatVerdict(rating: string): string {\n''',
              '''function normalizeVerdictCounts(counts: Record<string, number>) {\n  return normalizeKnownEnumCounts(counts, FACTCHECK_RATINGS);\n}\n\nfunction formatVerdict(rating: string): string {\n''',
          )

          replace(
              "src/tools/factchecks.ts",
              '''      lines.push("## Répartition globale des fact-checks par verdict");\n      for (const [verdict, count] of Object.entries(data.global.byVerdict).sort(\n        (a, b) => b[1] - a[1],\n      )) {\n        lines.push(`- ${formatVerdict(verdict)} : **${count}**`);\n      }\n''',
              '''      lines.push("## Répartition globale des fact-checks par verdict");\n      const globalVerdicts = normalizeVerdictCounts(data.global.byVerdict);\n      for (const [verdict, count] of Object.entries(globalVerdicts.known).sort(\n        (a, b) => (b[1] ?? 0) - (a[1] ?? 0),\n      )) {\n        lines.push(`- ${formatVerdict(verdict)} : **${count}**`);\n      }\n      if (globalVerdicts.unrecognizedCount > 0) {\n        lines.push(\n          `- Verdict normalisé non disponible : **${globalVerdicts.unrecognizedCount}**`,\n        );\n      }\n''',
          )

          replace(
              "src/tools/factchecks.ts",
              '''          global: data.global,\n          byPartyMentions: data.byParty.map((party) => ({\n            partyShortName: party.partyShortName,\n            partyName: party.partyName,\n            partySlug: party.partySlug,\n            totalMentions: party.totalMentions,\n            factcheckVerdictsForMentions: party.byVerdict,\n          })),\n          byPoliticianMentions: data.byPolitician.map((politician) => ({\n            fullName: politician.fullName,\n            slug: politician.slug,\n            partyShortName: politician.partyShortName,\n            totalMentions: politician.totalMentions,\n            factcheckVerdictsForMentions: politician.byVerdict,\n          })),\n          bySource: data.bySource,\n''',
              '''          global: {\n            totalFactChecks: data.global.totalFactChecks,\n            byVerdict: globalVerdicts.known,\n            unrecognizedVerdictCount: globalVerdicts.unrecognizedCount,\n          },\n          byPartyMentions: data.byParty.map((party) => {\n            const verdicts = normalizeVerdictCounts(party.byVerdict);\n            return {\n              partyShortName: party.partyShortName,\n              partyName: party.partyName,\n              partySlug: party.partySlug,\n              totalMentions: party.totalMentions,\n              factcheckVerdictsForMentions: verdicts.known,\n              unrecognizedVerdictMentions: verdicts.unrecognizedCount,\n            };\n          }),\n          byPoliticianMentions: data.byPolitician.map((politician) => {\n            const verdicts = normalizeVerdictCounts(politician.byVerdict);\n            return {\n              fullName: politician.fullName,\n              slug: politician.slug,\n              partyShortName: politician.partyShortName,\n              totalMentions: politician.totalMentions,\n              factcheckVerdictsForMentions: verdicts.known,\n              unrecognizedVerdictMentions: verdicts.unrecognizedCount,\n            };\n          }),\n          bySource: data.bySource.map((source) => {\n            const verdicts = normalizeVerdictCounts(source.byVerdict);\n            return {\n              source: source.source,\n              total: source.total,\n              factcheckVerdicts: verdicts.known,\n              unrecognizedVerdictCount: verdicts.unrecognizedCount,\n            };\n          }),\n''',
          )

          replace(
              "src/tests/editorial.test.ts",
              '''  knownEnumCode,\n  PARTICIPATION_PUBLICATION_STATUSES,\n''',
              '''  knownEnumCode,\n  normalizeKnownEnumCounts,\n  PARTICIPATION_PUBLICATION_STATUSES,\n''',
          )
          replace(
              "src/tests/editorial.test.ts",
              '''test("publication metadata enums fail closed when upstream adds a new code", () => {\n''',
              '''test("structured enum count maps aggregate unknown codes without exposing their names", () => {\n  const result = normalizeKnownEnumCounts(\n    { TRUE: 3, FALSE: 2, FUTURE_RATING: 4 },\n    ["TRUE", "FALSE"] as const,\n  );\n  assert.deepEqual(result.known, { TRUE: 3, FALSE: 2 });\n  assert.equal(result.unrecognizedCount, 4);\n  assert.equal("FUTURE_RATING" in result.known, false);\n});\n\ntest("publication metadata enums fail closed when upstream adds a new code", () => {\n''',
          )

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-final-structured-hardening.yml
      - name: Format and validate
        run: |
          npx prettier --write src/editorial.ts src/tools/affairs.ts src/tools/factchecks.ts src/tests/editorial.test.ts
          npm run build
          npm run test:unit
          git diff --check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editorial.ts src/tools/affairs.ts src/tools/factchecks.ts src/tests/editorial.test.ts .github/workflows/mcp01-final-structured-hardening.yml
          git commit -m "fix: close final structured output gaps"
          git push origin HEAD:mcp-01/consume-public-contract
