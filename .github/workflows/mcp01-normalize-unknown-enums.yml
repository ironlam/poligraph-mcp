name: MCP-01 normalize unknown structured enums

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-normalize-unknown-enums.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep unknown enum codes non-publishable in structured content
        shell: python {0}
        run: |
          from pathlib import Path

          def patch(pathname: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(pathname)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"expected snippet not found in {pathname}: {old[:90]!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          patch("src/tools/elections.ts", [
              ('import { fetchAPI, formatDate } from "../api.js";\n',
               'import { fetchAPI, formatDate } from "../api.js";\nimport { knownEnumCode } from "../editorial.js";\n'),
              ('function formatElectionType(type: string): string {\n',
               'const ELECTION_TYPES = [\n  "PRESIDENTIELLE",\n  "LEGISLATIVES",\n  "SENATORIALES",\n  "MUNICIPALES",\n  "DEPARTEMENTALES",\n  "REGIONALES",\n  "EUROPEENNES",\n  "REFERENDUM",\n] as const;\n\nconst ELECTION_STATUSES = [\n  "UPCOMING",\n  "REGISTRATION",\n  "CANDIDACIES",\n  "CAMPAIGN",\n  "ROUND_1",\n  "BETWEEN_ROUNDS",\n  "ROUND_2",\n  "COMPLETED",\n] as const;\n\nfunction formatElectionType(type: string): string {\n'),
              ('            type: election.type,\n',
               '            type: knownEnumCode(election.type, ELECTION_TYPES),\n'),
              ('            status: election.status,\n',
               '            status: knownEnumCode(election.status, ELECTION_STATUSES),\n'),
              ('          type: data.type,\n',
               '          type: knownEnumCode(data.type, ELECTION_TYPES),\n'),
              ('          status: data.status,\n',
               '          status: knownEnumCode(data.status, ELECTION_STATUSES),\n'),
          ])

          patch("src/tools/parties.ts", [
              ('import { quoteData } from "../editorial.js";\n',
               'import { knownEnumCode, quoteData } from "../editorial.js";\n'),
              ('function formatPosition(position: string | null): string {\n',
               'const POLITICAL_POSITIONS = [\n  "FAR_LEFT",\n  "LEFT",\n  "CENTER_LEFT",\n  "CENTER",\n  "CENTER_RIGHT",\n  "RIGHT",\n  "FAR_RIGHT",\n] as const;\n\nfunction formatPosition(position: string | null): string {\n'),
              ('            politicalPosition: party.politicalPosition,\n',
               '            politicalPosition: knownEnumCode(\n              party.politicalPosition,\n              POLITICAL_POSITIONS,\n            ),\n'),
              ('          politicalPosition: data.politicalPosition,\n',
               '          politicalPosition: knownEnumCode(\n            data.politicalPosition,\n            POLITICAL_POSITIONS,\n          ),\n'),
          ])

          patch("src/tools/factchecks.ts", [
              ('import { quoteData } from "../editorial.js";\n',
               'import { knownEnumCode, quoteData } from "../editorial.js";\n'),
              ('function formatVerdict(rating: string): string {\n',
               'const FACTCHECK_RATINGS = [\n  "TRUE",\n  "MOSTLY_TRUE",\n  "HALF_TRUE",\n  "MISLEADING",\n  "OUT_OF_CONTEXT",\n  "MOSTLY_FALSE",\n  "FALSE",\n  "UNVERIFIABLE",\n] as const;\n\nfunction formatVerdict(rating: string): string {\n'),
              ('            verdictRating: factCheck.verdictRating,\n',
               '            verdictRating: knownEnumCode(\n              factCheck.verdictRating,\n              FACTCHECK_RATINGS,\n            ),\n'),
          ])

          patch("src/tools/votes.ts", [
              ('import { participationLine } from "../editorial.js";\n',
               'import { knownEnumCode, participationLine } from "../editorial.js";\n'),
              ('function formatResult(result: string): string {\n',
               'const VOTE_RESULTS = ["ADOPTED", "REJECTED"] as const;\nconst VOTE_POSITIONS = [\n  "POUR",\n  "CONTRE",\n  "ABSTENTION",\n  "NON_VOTANT",\n  "ABSENT",\n] as const;\n\nfunction formatResult(result: string): string {\n'),
              ('            result: scrutin.result,\n',
               '            result: knownEnumCode(scrutin.result, VOTE_RESULTS),\n'),
              ('            position: vote.position,\n',
               '            position: knownEnumCode(vote.position, VOTE_POSITIONS),\n'),
              ('              result: vote.scrutin.result,\n',
               '              result: knownEnumCode(vote.scrutin.result, VOTE_RESULTS),\n'),
          ])
      - name: Format changed files
        run: npx prettier --write src/editorial.ts src/tools/elections.ts src/tools/parties.ts src/tools/factchecks.ts src/tools/votes.ts
      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-normalize-unknown-enums.yml
      - name: Verify
        run: |
          npx prettier --check src/editorial.ts src/tools/elections.ts src/tools/parties.ts src/tools/factchecks.ts src/tools/votes.ts
          git diff --check
          grep -q 'knownEnumCode(election.type, ELECTION_TYPES)' src/tools/elections.ts
          grep -q 'knownEnumCode(scrutin.result, VOTE_RESULTS)' src/tools/votes.ts
          grep -q 'knownEnumCode' src/tools/parties.ts
          grep -q 'knownEnumCode' src/tools/factchecks.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editorial.ts src/tools/elections.ts src/tools/parties.ts src/tools/factchecks.ts src/tools/votes.ts .github/workflows/mcp01-normalize-unknown-enums.yml
          git commit -m "fix: keep unknown enums non-publishable"
          git push origin HEAD:mcp-01/consume-public-contract
