name: MCP-01 gate structured participation rates

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-participation-structured-gate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate structured participation rates
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual} for {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/editorial.ts",
              '''export function participationLine(\n  value: ParticipationPublication,\n): string {\n  if (\n    value.participationStatus === "AVAILABLE" &&\n    value.participationRate !== null &&\n    Number.isFinite(value.participationRate)\n  ) {\n    return `**Taux de participation** : ${value.participationRate}%`;\n  }\n\n  return "**Taux de participation** : non publié avec les données actuellement disponibles";\n}\n''',
              '''export function publishedParticipationRate(\n  value: ParticipationPublication,\n): number | null {\n  return value.participationStatus === "AVAILABLE" &&\n    value.participationRate !== null &&\n    Number.isFinite(value.participationRate)\n    ? value.participationRate\n    : null;\n}\n\nexport function participationLine(\n  value: ParticipationPublication,\n): string {\n  const rate = publishedParticipationRate(value);\n  if (rate !== null) {\n    return `**Taux de participation** : ${rate}%`;\n  }\n\n  return "**Taux de participation** : non publié avec les données actuellement disponibles";\n}\n''',
          )

          replace(
              "src/tools/votes.ts",
              '''  knownEnumCode,\n  participationLine,\n  PARTICIPATION_PUBLICATION_STATUSES,\n''',
              '''  knownEnumCode,\n  participationLine,\n  PARTICIPATION_PUBLICATION_STATUSES,\n  publishedParticipationRate,\n''',
          )

          replace(
              "src/tools/votes.ts",
              '''          stats: {\n            ...data.stats,\n            participationStatus: knownEnumCode(\n''',
              '''          stats: {\n            ...data.stats,\n            participationRate: publishedParticipationRate(data.stats),\n            participationStatus: knownEnumCode(\n''',
          )
          replace(
              "src/tools/votes.ts",
              '''          global: {\n            ...data.global,\n            participationStatus: knownEnumCode(\n''',
              '''          global: {\n            ...data.global,\n            participationRate: publishedParticipationRate(data.global),\n            participationStatus: knownEnumCode(\n''',
          )
          replace(
              "src/tools/votes.ts",
              '''            participationRate: party.participationRate,\n            participationStatus: knownEnumCode(\n''',
              '''            participationRate: publishedParticipationRate(party),\n            participationStatus: knownEnumCode(\n''',
          )

          replace(
              "src/tests/editorial.test.ts",
              '''  PARTICIPATION_PUBLICATION_STATUSES,\n  participationLine,\n''',
              '''  PARTICIPATION_PUBLICATION_STATUSES,\n  participationLine,\n  publishedParticipationRate,\n''',
          )
          replace(
              "src/tests/editorial.test.ts",
              '''test("a numeric participation rate without publication status stays unpublished", () => {\n  const line = participationLine({ participationRate: 100 });\n  assert.match(line, /non publié/);\n  assert.doesNotMatch(line, /100%/);\n});\n''',
              '''test("a numeric participation rate without publication status stays unpublished", () => {\n  const value = { participationRate: 100 };\n  const line = participationLine(value);\n  assert.match(line, /non publié/);\n  assert.doesNotMatch(line, /100%/);\n  assert.equal(publishedParticipationRate(value), null);\n});\n\ntest("structured participation preserves real zero only when explicitly AVAILABLE", () => {\n  assert.equal(\n    publishedParticipationRate({\n      participationRate: 0,\n      participationStatus: "AVAILABLE",\n    }),\n    0,\n  );\n  assert.equal(\n    publishedParticipationRate({\n      participationRate: 73.4,\n      participationStatus: "SOURCE_INSUFFICIENT",\n    }),\n    null,\n  );\n  assert.equal(\n    publishedParticipationRate({\n      participationRate: Number.NaN,\n      participationStatus: "AVAILABLE",\n    }),\n    null,\n  );\n});\n''',
          )

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-participation-structured-gate.yml
      - name: Format and validate
        run: |
          npx prettier --write src/editorial.ts src/tools/votes.ts src/tests/editorial.test.ts
          npm run build
          npm run test:unit
          git diff --check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editorial.ts src/tools/votes.ts src/tests/editorial.test.ts .github/workflows/mcp01-participation-structured-gate.yml
          git commit -m "fix: gate structured participation rates"
          git push origin HEAD:mcp-01/consume-public-contract
