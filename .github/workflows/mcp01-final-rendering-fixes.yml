name: MCP-01 final rendering fixes

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-final-rendering-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0

      - name: Apply exact rendering fixes
        shell: python {0}
        run: |
          from pathlib import Path

          elections = Path("src/tools/elections.ts")
          text = elections.read_text(encoding="utf-8")
          if '" (non confirmée)"' not in text or '" (non confirmé)"' not in text:
              raise SystemExit("expected election confirmation labels not found")
          text = text.replace('" (non confirmée)"', '" (date non confirmée)"')
          text = text.replace('" (non confirmé)"', '" (date non confirmée)"')
          elections.write_text(text, encoding="utf-8")

          editorial = Path("src/editorial.ts")
          text = editorial.read_text(encoding="utf-8")
          old = "\n".join([
              "  lines.push(`**Faits qualifiés** : ${semantics.categoryLabel}`);",
              "  lines.push(`_${semantics.statusDescription}_`);",
          ])
          new = "\n".join([
              "  lines.push(`**Faits qualifiés** : ${semantics.categoryLabel}`);",
              '  lines.push("_Description du statut, donnée Poligraph :_");',
              "  lines.push(quoteData(semantics.statusDescription));",
          ])
          if old not in text:
              raise SystemExit("status description rendering block not found")
          editorial.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-final-rendering-fixes.yml

      - name: Verify patch
        run: |
          git diff --check
          grep -F 'date non confirmée' src/tools/elections.ts
          grep -F 'quoteData(semantics.statusDescription)' src/editorial.ts
          if grep -F '(non confirmé)' src/tools/elections.ts; then exit 1; fi
          if grep -F '(non confirmée)' src/tools/elections.ts; then exit 1; fi

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/elections.ts src/editorial.ts .github/workflows/mcp01-final-rendering-fixes.yml
          git commit -m "fix: harden final MCP editorial rendering"
          git push origin HEAD:mcp-01/consume-public-contract
