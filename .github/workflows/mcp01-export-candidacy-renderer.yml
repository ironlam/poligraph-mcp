name: MCP-01 export candidacy renderer

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-export-candidacy-renderer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0
      - name: Export pure renderer
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path("src/tools/elections.ts")
          text = path.read_text(encoding="utf-8")
          old = "function candidacyLine(candidacy: Candidacy): string {"
          new = "export function candidacyLine(candidacy: Candidacy): string {"
          if text.count(old) != 1:
              raise SystemExit("candidacyLine declaration not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-export-candidacy-renderer.yml
      - name: Verify
        run: |
          git diff --check
          grep -F 'export function candidacyLine' src/tools/elections.ts
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/elections.ts .github/workflows/mcp01-export-candidacy-renderer.yml
          git commit -m "test: expose pure candidacy renderer"
          git push origin HEAD:mcp-01/consume-public-contract
