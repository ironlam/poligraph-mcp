name: MCP-01 final B structured consistency

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-final-b-structured-consistency.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0

      - name: Apply structured consistency fixes
        shell: python {0}
        run: |
          from pathlib import Path

          affairs = Path("src/tools/affairs.ts")
          text = affairs.read_text(encoding="utf-8")
          old = "\n".join([
              "  if (",
              "    (affairs.length > 0 && knownValues.length !== affairs.length) ||",
              "    knownValues.some((value) => value !== expected)",
              "  ) {",
              "    throw new ApiError(",
          ])
          new = "\n".join([
              "  // fetchAPI has already accepted a 2xx response here. Invalid client filter",
              "  // values must be rejected by the public API as 4xx; a successful response",
              "  // that omits or changes the requested filter is therefore an upstream",
              "  // contract violation and intentionally maps to 502.",
              "  if (",
              "    (affairs.length > 0 && knownValues.length !== affairs.length) ||",
              "    knownValues.some((value) => value !== expected)",
              "  ) {",
              "    throw new ApiError(",
          ])
          if old not in text:
              raise SystemExit("affair filter contract block not found")
          text = text.replace(old, new, 1)

          old = "\n".join([
              "    verdictDate: statusAppliesToPolitician ? affair.verdictDate : null,",
              "    sentence: statusAppliesToPolitician ? affair.sentence : null,",
              "    sources: affair.sources.map((source) => ({",
          ])
          new = "\n".join([
              "    verdictDate: statusAppliesToPolitician ? affair.verdictDate : null,",
              "    sentence: statusAppliesToPolitician ? affair.sentence : null,",
              "    appeal: statusAppliesToPolitician ? affair.appeal : null,",
              "    sources: affair.sources.map((source) => ({",
          ])
          if old not in text:
              raise SystemExit("structured affair person-specific block not found")
          affairs.write_text(text.replace(old, new, 1), encoding="utf-8")

          mandates = Path("src/tools/mandates.ts")
          text = mandates.read_text(encoding="utf-8")
          old = "\n".join([
              "      if (type && data.data.some((mandate) => mandate.type !== type)) {",
              "        throw new ApiError(",
          ])
          new = "\n".join([
              "      // A 2xx response has already been received. Invalid client values belong",
              "      // to the public API's 4xx validation; a mismatched successful payload is",
              "      // an upstream contract violation and intentionally maps to 502.",
              "      if (type && data.data.some((mandate) => mandate.type !== type)) {",
              "        throw new ApiError(",
          ])
          if old not in text:
              raise SystemExit("mandate filter contract block not found")
          mandates.write_text(text.replace(old, new, 1), encoding="utf-8")

          politicians = Path("src/tools/politicians.ts")
          text = politicians.read_text(encoding="utf-8")
          old = "          factchecksCount: data.factchecksCount ?? 0,"
          new = "          factchecksCount: data.factchecksCount ?? null,"
          if old not in text:
              raise SystemExit("factchecksCount structured fallback not found")
          politicians.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-final-b-structured-consistency.yml

      - name: Verify patch
        run: |
          git diff --check
          grep -F 'appeal: statusAppliesToPolitician ? affair.appeal : null' src/tools/affairs.ts
          grep -F 'factchecksCount: data.factchecksCount ?? null' src/tools/politicians.ts
          grep -F 'contract violation and intentionally maps to 502' src/tools/affairs.ts
          grep -F 'upstream contract violation and intentionally maps to 502' src/tools/mandates.ts

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/affairs.ts src/tools/mandates.ts src/tools/politicians.ts .github/workflows/mcp01-final-b-structured-consistency.yml
          git commit -m "fix: align structured MCP judicial output"
          git push origin HEAD:mcp-01/consume-public-contract
