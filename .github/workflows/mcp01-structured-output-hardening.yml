name: MCP-01 structured output hardening

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-structured-output-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply fail-closed structured output remediation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual} for {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "src/editorial.ts",
              'export type FieldPublicationStatus = "AVAILABLE" | "UNVERIFIED" | (string & {});\n',
              'export type FieldPublicationStatus = "AVAILABLE" | "UNVERIFIED" | (string & {});\n\nexport const PARTICIPATION_PUBLICATION_STATUSES = [\n  "AVAILABLE",\n  "SOURCE_INSUFFICIENT",\n  "COMPUTATION_INCOMPLETE",\n] as const;\n\nexport const START_DATE_PUBLICATION_STATUSES = ["AVAILABLE", "UNVERIFIED"] as const;\n',
          )

          replace(
              "src/tools/votes.ts",
              'import { knownEnumCode, participationLine } from "../editorial.js";\n',
              'import {\n  knownEnumCode,\n  participationLine,\n  PARTICIPATION_PUBLICATION_STATUSES,\n} from "../editorial.js";\n',
          )
          replace(
              "src/tools/votes.ts",
              '          stats: data.stats,\n',
              '          stats: {\n            ...data.stats,\n            participationStatus: knownEnumCode(\n              data.stats.participationStatus,\n              PARTICIPATION_PUBLICATION_STATUSES,\n            ),\n          },\n',
          )
          replace(
              "src/tools/votes.ts",
              '          global: data.global,\n',
              '          global: {\n            ...data.global,\n            participationStatus: knownEnumCode(\n              data.global.participationStatus,\n              PARTICIPATION_PUBLICATION_STATUSES,\n            ),\n          },\n',
          )
          replace(
              "src/tools/votes.ts",
              '            participationStatus: party.participationStatus ?? null,\n',
              '            participationStatus: knownEnumCode(\n              party.participationStatus,\n              PARTICIPATION_PUBLICATION_STATUSES,\n            ),\n',
          )

          replace(
              "src/tools/politicians.ts",
              'import {\n  canPublishStartDate,\n  type FieldPublicationStatus,\n  isPublishedNumber,\n  quoteData,\n  UNVERIFIED_DATE_NOTICE,\n} from "../editorial.js";\n',
              'import {\n  canPublishStartDate,\n  type FieldPublicationStatus,\n  isPublishedNumber,\n  knownEnumCode,\n  quoteData,\n  START_DATE_PUBLICATION_STATUSES,\n  UNVERIFIED_DATE_NOTICE,\n} from "../editorial.js";\n',
          )
          replace(
              "src/tools/politicians.ts",
              '            startDatePublicationStatus:\n              mandate.startDatePublicationStatus ?? null,\n',
              '            startDatePublicationStatus: knownEnumCode(\n              mandate.startDatePublicationStatus,\n              START_DATE_PUBLICATION_STATUSES,\n            ),\n',
          )

          replace(
              "src/tools/mandates.ts",
              'import {\n  canPublishStartDate,\n  type FieldPublicationStatus,\n  UNVERIFIED_DATE_NOTICE,\n} from "../editorial.js";\n',
              'import {\n  canPublishStartDate,\n  type FieldPublicationStatus,\n  knownEnumCode,\n  START_DATE_PUBLICATION_STATUSES,\n  UNVERIFIED_DATE_NOTICE,\n} from "../editorial.js";\n',
          )
          replace(
              "src/tools/mandates.ts",
              '              startDatePublicationStatus:\n                mandate.startDatePublicationStatus ?? null,\n',
              '              startDatePublicationStatus: knownEnumCode(\n                mandate.startDatePublicationStatus,\n                START_DATE_PUBLICATION_STATUSES,\n              ),\n',
          )

          replace(
              "src/tools/affairs.ts",
              '  PRESUMPTION_NOTICE,\n  quoteData,\n} from "../editorial.js";\n',
              '  knownEnumCode,\n  PRESUMPTION_NOTICE,\n  quoteData,\n} from "../editorial.js";\n',
          )
          replace(
              "src/tools/affairs.ts",
              'function assertFilterApplied(\n',
              '''const AFFAIR_STATUSES = [\n  "ENQUETE_PRELIMINAIRE",\n  "INSTRUCTION",\n  "INSTRUCTION_CLOTUREE_SANS_MISE_EN_EXAMEN",\n  "MISE_EN_EXAMEN",\n  "RENVOI_TRIBUNAL",\n  "PROCES_EN_COURS",\n  "CONDAMNATION_PREMIERE_INSTANCE",\n  "APPEL_EN_COURS",\n  "POURVOI_EN_CASSATION",\n  "CONDAMNATION_DEFINITIVE",\n  "RELAXE",\n  "ACQUITTEMENT",\n  "NON_LIEU",\n  "PRESCRIPTION",\n  "CLASSEMENT_SANS_SUITE",\n] as const;\n\nconst AFFAIR_CATEGORIES = [\n  "CORRUPTION",\n  "CORRUPTION_PASSIVE",\n  "TRAFIC_INFLUENCE",\n  "PRISE_ILLEGALE_INTERETS",\n  "FAVORITISME",\n  "DETOURNEMENT_FONDS_PUBLICS",\n  "FRAUDE_FISCALE",\n  "BLANCHIMENT",\n  "ABUS_BIENS_SOCIAUX",\n  "ABUS_CONFIANCE",\n  "EMPLOI_FICTIF",\n  "FINANCEMENT_ILLEGAL_CAMPAGNE",\n  "FINANCEMENT_ILLEGAL_PARTI",\n  "HARCELEMENT_MORAL",\n  "HARCELEMENT_SEXUEL",\n  "AGRESSION_SEXUELLE",\n  "VIOLENCE",\n  "MENACE",\n  "DIFFAMATION",\n  "INJURE",\n  "INCITATION_HAINE",\n  "FAUX_ET_USAGE_FAUX",\n  "RECEL",\n  "CONFLIT_INTERETS",\n  "AUTRE",\n] as const;\n\nconst AFFAIR_INVOLVEMENTS = [\n  "DIRECT",\n  "INDIRECT",\n  "MENTIONED_ONLY",\n  "VICTIM",\n  "PLAINTIFF",\n] as const;\n\nconst CERTAINTY_LEVELS = [\n  "ETABLI",\n  "PRONONCE",\n  "EN_COURS",\n  "CLOS_SANS_CHARGE",\n  "CLOS_FAVORABLE",\n] as const;\n\nconst JUDICIAL_MATURITY_LEVELS = [\n  "CONDAMNATION",\n  "PROCEDURE_VALIDEE",\n  "ENQUETE",\n  "INSTRUCTION_CLOSE",\n  "CLOSE_SANS_CONDAMNATION",\n] as const;\n\nfunction assertFilterApplied(\n''',
          )
          replace(
              "src/tools/affairs.ts",
              '''    statusCode: semanticsAvailable ? affair.status : null,\n    categoryCode: semanticsAvailable ? affair.category : null,\n    involvementCode: semanticsAvailable ? (affair.involvement ?? null) : null,\n    semantics: affair.semantics ?? null,\n''',
              '''    statusCode: semanticsAvailable\n      ? knownEnumCode(affair.status, AFFAIR_STATUSES)\n      : null,\n    categoryCode: semanticsAvailable\n      ? knownEnumCode(affair.category, AFFAIR_CATEGORIES)\n      : null,\n    involvementCode: semanticsAvailable\n      ? knownEnumCode(affair.involvement, AFFAIR_INVOLVEMENTS)\n      : null,\n    semantics: affair.semantics\n      ? {\n          ...affair.semantics,\n          statusDescription: quoteData(affair.semantics.statusDescription),\n          certaintyLevel: knownEnumCode(\n            affair.semantics.certaintyLevel,\n            CERTAINTY_LEVELS,\n          ),\n          judicialMaturity: knownEnumCode(\n            affair.semantics.judicialMaturity,\n            JUDICIAL_MATURITY_LEVELS,\n          ),\n        }\n      : null,\n''',
          )
          replace(
              "src/tools/affairs.ts",
              '''    sentence: statusAppliesToPolitician ? affair.sentence : null,\n    appeal: statusAppliesToPolitician ? affair.appeal : null,\n''',
              '''    sentence:\n      statusAppliesToPolitician && affair.sentence\n        ? quoteData(affair.sentence)\n        : null,\n    appeal:\n      statusAppliesToPolitician && affair.appeal\n        ? quoteData(affair.appeal)\n        : null,\n''',
          )

          replace(
              "src/tools/factchecks.ts",
              '            claimText: factCheck.claimText,\n',
              '            claimText: quoteData(factCheck.claimText),\n',
              2,
          )
          replace(
              "src/tools/factchecks.ts",
              '            verdict: factCheck.verdict,\n',
              '            verdict: quoteData(factCheck.verdict),\n',
              2,
          )

          replace(
              "src/tools/parties.ts",
              '          description: data.description,\n',
              '          description: data.description ? quoteData(data.description) : null,\n',
          )

          replace(
              "src/tests/editorial.test.ts",
              '  knownEnumCode,\n  participationLine,\n',
              '  knownEnumCode,\n  PARTICIPATION_PUBLICATION_STATUSES,\n  participationLine,\n  START_DATE_PUBLICATION_STATUSES,\n',
          )
          replace(
              "src/tests/editorial.test.ts",
              'test("missing affair semantics fails safe without exposing an internal code", () => {\n',
              '''test("publication metadata enums fail closed when upstream adds a new code", () => {\n  assert.equal(\n    knownEnumCode("AVAILABLE", PARTICIPATION_PUBLICATION_STATUSES),\n    "AVAILABLE",\n  );\n  assert.equal(\n    knownEnumCode("FUTURE_STATUS", PARTICIPATION_PUBLICATION_STATUSES),\n    null,\n  );\n  assert.equal(\n    knownEnumCode("UNVERIFIED", START_DATE_PUBLICATION_STATUSES),\n    "UNVERIFIED",\n  );\n  assert.equal(\n    knownEnumCode("FUTURE_STATUS", START_DATE_PUBLICATION_STATUSES),\n    null,\n  );\n});\n\ntest("missing affair semantics fails safe without exposing an internal code", () => {\n''',
          )
      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-structured-output-hardening.yml
      - name: Validate deterministic remediation
        run: |
          npm run build
          npm run test:unit
          git diff --check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editorial.ts src/tools/votes.ts src/tools/politicians.ts src/tools/mandates.ts src/tools/affairs.ts src/tools/factchecks.ts src/tools/parties.ts src/tests/editorial.test.ts .github/workflows/mcp01-structured-output-hardening.yml
          git commit -m "fix: fail closed structured MCP output"
          git push origin HEAD:mcp-01/consume-public-contract
