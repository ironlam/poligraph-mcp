name: MCP-01 live contract verifier remediation

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-live-contract-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0

      - name: Strengthen upstream publication contract tests
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path("src/tests/api-contract.test.ts")
          text = path.read_text(encoding="utf-8")

          helper_marker = '''function assertStringOrNull(val: unknown, field: string): void {\n  assert.ok(\n    typeof val === "string" || val === null,\n    `${field} should be string|null, got ${typeof val}`,\n  );\n}\n'''
          helper_replacement = helper_marker + '''\nfunction assertParticipationStatus(val: unknown, field: string): void {\n  assertString(val, field);\n  assert.ok(\n    ["AVAILABLE", "SOURCE_INSUFFICIENT", "COMPUTATION_INCOMPLETE"].includes(val as string),\n    `${field} has unexpected value ${String(val)}`,\n  );\n}\n'''
          if helper_marker not in text:
              raise SystemExit("helper marker not found")
          text = text.replace(helper_marker, helper_replacement, 1)

          detail_marker = '      assertString(m.startDate, "mandate.startDate");\n'
          detail_replacement = detail_marker + '      assertString(m.startDatePublicationStatus, "mandate.startDatePublicationStatus");\n'
          if detail_marker not in text:
              raise SystemExit("mandate detail marker not found")
          text = text.replace(detail_marker, detail_replacement, 1)

          politician_stats_marker = '    assertNumberOrNull(stats.participationRate, "stats.participationRate");\n'
          politician_stats_replacement = politician_stats_marker + '    assertParticipationStatus(stats.participationStatus, "stats.participationStatus");\n'
          if politician_stats_marker not in text:
              raise SystemExit("politician vote stats marker not found")
          text = text.replace(politician_stats_marker, politician_stats_replacement, 1)

          party_stats_marker = '    assertNumberOrNull(p.participationRate, "participationRate");\n'
          party_stats_replacement = party_stats_marker + '    assertParticipationStatus(p.participationStatus, "participationStatus");\n'
          if party_stats_marker not in text:
              raise SystemExit("party stats marker not found")
          text = text.replace(party_stats_marker, party_stats_replacement, 1)

          senate_test = '''\n\n  it("requires Senate participation publication status", async () => {\n    const data = await fetchJSON<Record<string, unknown>>(\n      "/api/votes/stats?chamber=SENAT&limit=3",\n    );\n\n    assert.ok(Array.isArray(data.parties), "Senate parties should be an array");\n    const parties = data.parties as Record<string, unknown>[];\n    assert.ok(parties.length > 0, "should return Senate party stats");\n\n    for (const party of parties) {\n      assertNumberOrNull(party.participationRate, "senate.participationRate");\n      assertParticipationStatus(\n        party.participationStatus,\n        "senate.participationStatus",\n      );\n    }\n  });\n'''
          describe_end_marker = '\n});\n\ndescribe("GET /api/search/advanced", () => {'
          if describe_end_marker not in text:
              raise SystemExit("vote stats describe end marker not found")
          text = text.replace(describe_end_marker, senate_test + '\n});\n\ndescribe("GET /api/search/advanced", () => {', 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-live-contract-remediation.yml

      - name: Verify patch
        run: |
          git diff --check
          grep -q 'mandate.startDatePublicationStatus' src/tests/api-contract.test.ts
          grep -q 'stats.participationStatus' src/tests/api-contract.test.ts
          grep -q 'chamber=SENAT' src/tests/api-contract.test.ts

      - name: Commit contract tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/api-contract.test.ts .github/workflows/mcp01-live-contract-remediation.yml
          git commit -m "test: require upstream publication status contract"
          git push origin HEAD:mcp-01/consume-public-contract
