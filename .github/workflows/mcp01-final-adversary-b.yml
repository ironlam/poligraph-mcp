name: MCP-01 final adversary B fixes

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-final-adversary-b.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0

      - name: Apply final consistency fixes
        shell: python
        run: |
          from pathlib import Path

          politicians = Path("src/tools/politicians.ts")
          text = politicians.read_text(encoding="utf-8")
          old = 'terminé ; dates de début non publiée et de fin non renseignée'
          new = 'terminé ; date de début non publiée et date de fin non renseignée'
          if old not in text:
              raise SystemExit("Mandate wording not found")
          politicians.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = 'le total legacy `affairsCount`, qui mélange tous les rôles publiés, reste disponible uniquement pour compatibilité structurée et n\'est pas présenté comme indicateur à charge ;'
          new = 'le total legacy tous rôles est exposé par le MCP sous `legacyPublishedAffairsCountAllRoles`, uniquement pour compatibilité structurée, et n\'est pas présenté comme indicateur à charge ;'
          if old not in text:
              raise SystemExit("README legacy field wording not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-final-adversary-b.yml

      - name: Verify patch
        run: |
          git diff --check
          grep -F 'date de début non publiée et date de fin non renseignée' src/tools/politicians.ts
          grep -F 'legacyPublishedAffairsCountAllRoles' README.md

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md .github/workflows/mcp01-final-adversary-b.yml
          git commit -m "fix: align final MCP-01 wording and docs"
          git push origin HEAD:mcp-01/consume-public-contract
