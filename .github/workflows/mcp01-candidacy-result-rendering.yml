name: MCP-01 candidacy result rendering

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-candidacy-result-rendering.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0

      - name: Apply candidacy result rendering fix
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path("src/tools/elections.ts")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              '  const r1 =',
              '    candidacy.round1Pct !== null ? ` — T1: ${candidacy.round1Pct}%` : "";',
              '  const r2 =',
              '    candidacy.round2Pct !== null ? `, T2: ${candidacy.round2Pct}%` : "";',
              '  return `${candidacy.candidateName}${party}${r1}${r2}`;',
          ])
          new = "\n".join([
              '  const results: string[] = [];',
              '  if (candidacy.round1Pct !== null) results.push(`T1: ${candidacy.round1Pct}%`);',
              '  if (candidacy.round2Pct !== null) results.push(`T2: ${candidacy.round2Pct}%`);',
              '  const result = results.length > 0 ? ` — ${results.join(", ")}` : "";',
              '  return `${candidacy.candidateName}${party}${result}`;',
          ])
          if old not in text:
              raise SystemExit("candidacy result block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-candidacy-result-rendering.yml

      - name: Verify patch
        run: |
          git diff --check
          grep -F 'const results: string[] = [];' src/tools/elections.ts
          grep -F 'results.join(", ")' src/tools/elections.ts
          if grep -F 'candidacy.round2Pct !== null ? `, T2:' src/tools/elections.ts; then exit 1; fi

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/elections.ts .github/workflows/mcp01-candidacy-result-rendering.yml
          git commit -m "fix: render partial election round results cleanly"
          git push origin HEAD:mcp-01/consume-public-contract
