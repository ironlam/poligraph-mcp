name: MCP-01 address suppressed adversary findings

on:
  push:
    branches:
      - mcp-01/consume-public-contract
    paths:
      - .github/workflows/mcp01-address-suppressed-adversary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-01/consume-public-contract
          fetch-depth: 0

      - name: Apply exact fail-closed fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              Path("src/tools/affairs.ts"),
              "if (knownValues.some((value) => value !== expected)) {",
              "if (\n    (affairs.length > 0 && knownValues.length !== affairs.length) ||\n    knownValues.some((value) => value !== expected)\n  ) {",
              "affair filter guard",
          )

          replace_once(
              Path("src/tools/politicians.ts"),
              "  type FieldPublicationStatus,\n  UNVERIFIED_DATE_NOTICE,",
              "  type FieldPublicationStatus,\n  quoteData,\n  UNVERIFIED_DATE_NOTICE,",
              "editorial import block",
          )
          replace_once(
              Path("src/tools/politicians.ts"),
              "lines.push(`## ${cluster.label} (${cluster.nodes.length})`);",
              "lines.push(`## Relation (${cluster.nodes.length})`);\n        lines.push(quoteData(cluster.label));",
              "cluster label renderer",
          )

          replace_once(
              Path("src/api.ts"),
              "if (url.origin !== BASE_ORIGIN) {",
              "if (url.origin !== BASE_ORIGIN || !url.pathname.startsWith(\"/api/\")) {",
              "API path guard",
          )

      - name: Remove temporary workflow
        run: rm .github/workflows/mcp01-address-suppressed-adversary.yml

      - name: Verify patch
        run: |
          git diff --check
          git diff --stat

      - name: Commit targeted fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/mcp01-address-suppressed-adversary.yml
          git commit -m "fix: fail closed on suppressed MCP-01 findings"
          git push origin HEAD:mcp-01/consume-public-contract
